input:
  spectrum_path: Assets/SampleData
  input_glob: "*.fits"
  redshift: 0.021275453
  ra: 145.89219
  dec: 0.059372
  velocity_dispersion: 135.89957
  instrument_resolution: 2000
  flux_scale_factor: -17
  data_medium_air: false
  write_results: true

model:
  library: MaStar-E
  imf: Kroupa
  age_min: 0
  age_max: 14.7
  metallicity_min: -3
  metallicity_max: 3
  downgrade_models: true
  model_key: 18

fitting:
  engine: firefly
  legacy_gpu_fallback: true
  max_iterations: 10
  fit_per_iteration_cap: 1000
  max_ssp_components: 5
  use_gpu_evaluator: false
  experimental_mix_search: false
  experimental_mix_search_max_evals: 64
  max_parallel_fits: 0  # 0 = Parallel.For over all spectra (master / BAVCL_Update default)
  pdf_sampling: 200
  top_results_count: 3
  wave_limits: [0, 99999990]
  max_ebv: 1.0
  num_dust_vals: 200
  dust_smoothing_length: 100

dust:
  milky_way_reddening: true
  hpf_mode: on
  dust_law: calzetti

masking:
  masked_angstroms: 20
  emission_lines:
    - 6562.80
    - 6583.34
    - 6547.96
    - 4861.32

paths:
  stellar_population_models: Assets/StellarPopulationModels
  dust_maps: Assets/DustMaps
  output: output
  mass_loss_tables: Assets/MassLoss
